name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Installa uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Installa le dipendenze
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test con copertura
        # Soglia MPC-CC del Piano di Qualifica.
        run: uv run pytest --cov=app --cov-report=xml --cov-fail-under=70

      - name: Carica il report di copertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: api/coverage.xml

  web:
    name: Web (eslint + tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Installa pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Installa Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Controllo dei tipi
        run: pnpm tsc --noEmit

      - name: Test con copertura
        run: pnpm vitest run --coverage

      - name: Build
        run: pnpm build

      - name: Carica il report di copertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: web/coverage/lcov.info
